<text x="64" y="134" fill="#F2EFE8" font-size="50" font-weight="600" letter-spacing="-1.5">From final cut to <tspan fill="#C7A968">verified delivery.</tspan></text>
<text x="64" y="176" fill="#C9CBD1" font-size="19">Seven handoffs. Each needs its own evidence. An unresolved gate stops the journey.</text>
