<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">Content Operations workflow</title><desc id="desc">Prepare approved content, verify release, and follow through with recorded evidence.</desc><rect width="1200" height="320" rx="20" fill="#10151d"/><g fill="#f3f0e8" font-family="sans-serif"><text x="55" y="65" font-size="24">CONTENT OPERATIONS</text><text x="55" y="100" font-size="16" fill="#c8ad72">Evidence before action. Review before release.</text></g><g stroke="#5e8fa8" stroke-width="3"><path d="M350 195H440M740 195H830"/></g><g fill="#1c2530" stroke="#c8ad72"><rect x="55" y="145" width="295" height="110" rx="12"/><rect x="440" y="145" width="300" height="110" rx="12"/><rect x="830" y="145" width="315" height="110" rx="12"/></g><g font-family="sans-serif" fill="#f3f0e8"><text x="80" y="185" font-size="22">01 / Prepare</text><text x="80" y="220" font-size="16">Approved files + rights</text><text x="465" y="185" font-size="22">02 / Verify release</text><text x="465" y="220" font-size="16">Exact account + native post</text><text x="855" y="185" font-size="22">03 / Follow through</text><text x="855" y="220" font-size="16">Delivery + coverage + receipts</text><text x="55" y="290" font-size="14" fill="#c8ad72">CANDIDATE ONLY — no live automation or host certification implied</text></g></svg>